name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build reaches for these; none needs a real value to compile.
      # lib/db.ts degrades to empty content when Mongo is unreachable and
      # every public route is server-rendered on demand, so no page is
      # prerendered against the database at build time.
      MONGODB_URI: mongodb://127.0.0.1:27017/ci-placeholder
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-to-sign-anything
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so an obvious failure reports in seconds
      # rather than after a four-minute build.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guards the invariant that LOCALIZED_FIELDS, the Mongoose schemas and
      # the Zod schemas agree on which fields are bilingual. Pure static
      # analysis — no database.
      - name: i18n field check
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
